{% extends "core/base.html" %}
{% block title %}Invitation not available{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-16 space-y-5 text-center">
  <h1 class="font-serif text-2xl text-base-content">This invitation is no longer available</h1>
  <p class="text-base-content/70">
    The link has expired, or the person who invited you has withdrawn it. Please write
    to them for a new one.
  </p>
  <a href="/" class="btn btn-ghost btn-sm">Back to the site</a>
</div>
{% endblock %}
