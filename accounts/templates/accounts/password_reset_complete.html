{% extends "core/base.html" %}
{% block title %}Password updated — LSP{% endblock %}
{% block content %}
<div class="max-w-md mx-auto py-8 space-y-6">
  <header class="space-y-1">
    <h1 class="font-serif text-3xl text-base-content">Password updated</h1>
  </header>
  <div role="alert" class="alert alert-success">
    <span>Your password has been changed. You can now log in with it.</span>
  </div>
  <a href="{% url 'login' %}" class="btn btn-primary w-full">Log in</a>
</div>
{% endblock %}
