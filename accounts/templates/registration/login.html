{% extends "core/base.html" %}
{% block title %}Log in — LSP{% endblock %}
{% block content %}
<h1>Log in</h1>

{% if form.errors %}
<p class="muted">Email or password didn't match. Try again.</p>
{% endif %}

<form method="post">
  {% csrf_token %}
  <p>
    <label>Email<br>
      <input type="email" name="username" autocomplete="email" required autofocus>
    </label>
  </p>
  <p>
    <label>Password<br>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
  </p>
  <input type="hidden" name="next" value="{{ next }}">
  <p><button type="submit">Log in</button></p>
</form>

<p class="muted">
  No account? <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Sign up</a>.
</p>
{% endblock %}
