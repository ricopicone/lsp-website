<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: letter; margin: 2.5cm; }
  body { font-family: "Helvetica", "Arial", sans-serif; font-size: 11pt; line-height: 1.5; color: #1a1a1a; }
  h1 { font-size: 20pt; margin: 0 0 0.6em; }
  h2 { font-size: 15pt; margin: 1.2em 0 0.4em; }
  h3 { font-size: 12pt; margin: 1em 0 0.3em; }
  p { margin: 0 0 0.7em; }
  ul, ol { margin: 0 0 0.7em 1.2em; }
  blockquote { margin: 0 0 0.7em; padding-left: 0.8em; border-left: 2px solid #ccc; color: #555; }
  a { color: #1a4d8f; }
  .doc-title { border-bottom: 1px solid #ccc; padding-bottom: 0.3em; }
</style>
</head>
<body>
  <h1 class="doc-title">{{ title }}</h1>
  {{ body_html|safe }}
</body>
</html>
