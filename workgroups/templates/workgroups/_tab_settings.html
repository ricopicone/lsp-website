<div class="max-w-xl space-y-4">
  <section class="space-y-4 rounded-xl border border-base-300/60 bg-base-100 p-5">
    <div class="space-y-0.5">
      <h3 class="font-medium text-base-content">Dates</h3>
      <p class="text-xs text-base-content/50">When this group runs. Leave the end date blank for a standing group.</p>
    </div>
    <form method="post" action="{% url 'workgroups:update_dates' workgroup.slug %}"
          class="flex flex-wrap items-end gap-3">
      {% csrf_token %}
      <div class="space-y-1">
        <label for="{{ dates_form.start_date.id_for_label }}" class="block text-xs text-base-content/60">Start</label>
        {{ dates_form.start_date }}
      </div>
      <div class="space-y-1">
        <label for="{{ dates_form.end_date.id_for_label }}" class="block text-xs text-base-content/60">End</label>
        {{ dates_form.end_date }}
      </div>
      <button class="btn btn-primary btn-sm">Save dates</button>
    </form>
  </section>

  {% if cartel %}{% include "cartels/_settings.html" %}{% endif %}
</div>
