<div class="max-w-2xl space-y-5 pt-2">
  <form method="post" action="{% url 'workgroups:task_add' workgroup.slug %}"
        class="flex flex-wrap items-end gap-2">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Add a task…" required
           class="input input-bordered input-sm grow min-w-[14rem]">
    <select name="assignee" class="select select-bordered select-sm">
      <option value="">Unassigned</option>
      {% for m in members %}<option value="{{ m.user.pk }}">{{ m.user.get_full_name|default:m.user.email }}</option>{% endfor %}
    </select>
    <button class="btn btn-primary btn-sm">Add</button>
  </form>

  {% if tasks %}
  <ul class="divide-y divide-base-300/60 rounded-box border border-base-300 bg-base-100">
    {% for task in tasks %}
    <li class="flex items-center gap-3 p-3">
      <form method="post" action="{% url 'workgroups:task_toggle' workgroup.slug task.pk %}" style="display:contents">
        {% csrf_token %}
        <button type="submit" class="checkbox checkbox-sm {% if task.done %}checkbox-primary{% endif %}"
                aria-label="Toggle done" title="Toggle done">{% if task.done %}✓{% endif %}</button>
      </form>
      <span class="grow {% if task.done %}line-through text-base-content/40{% endif %}">{{ task.title }}</span>
      {% if task.assignee %}<span class="badge badge-sm badge-ghost">{{ task.assignee.get_full_name|default:task.assignee.email }}</span>{% endif %}
      <form method="post" action="{% url 'workgroups:task_delete' workgroup.slug task.pk %}" style="display:contents"
            onsubmit="return confirm('Delete this task?');">
        {% csrf_token %}
        <button type="submit" class="text-xs text-base-content/40 hover:text-error" aria-label="Delete">✕</button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="text-base-content/60 text-sm">No tasks yet.</p>
  {% endif %}
</div>
