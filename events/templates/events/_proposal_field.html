{% comment %}Renders one bound form field (label · widget · help · errors).
Expects: field.{% endcomment %}
<div class="space-y-1">
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="text-xs text-base-content/60">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<p class="text-error text-xs mt-1">{{ field.errors|join:", " }}</p>{% endif %}
</div>
