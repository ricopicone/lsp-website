{% comment %}Reply / Edit / Delete for one post. Expects: post, can_post.{% endcomment %}
<div class="flex items-center gap-3 mt-1 text-xs text-base-content/40">
  {% if can_post %}
  <a href="?reply_to={{ post.id }}#composer" class="hover:text-primary">Reply</a>
  {% endif %}
  {% if post.can_edit %}
  <a href="{% url 'parletre:edit_post' post.id %}" class="hover:text-primary">Edit</a>
  {% endif %}
  {% if post.can_delete %}
  <form method="post" action="{% url 'parletre:delete_post' post.id %}" style="display:contents"
        onsubmit="return confirm('Delete this message?');">
    {% csrf_token %}
    <button type="submit" class="hover:text-error">Delete</button>
  </form>
  {% endif %}
</div>
