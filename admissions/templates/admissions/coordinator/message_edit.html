{% extends "admissions/coordinator/base.html" %}
{% block tab_content %}
<div class="max-w-2xl space-y-4">
  <a href="{% url 'admissions:coordinator_messages' %}" class="text-sm link">← Messages</a>
  <h2 class="font-serif text-xl text-base-content">{{ template.get_key_display }}</h2>
  <p class="text-sm text-base-content/60">
    Tokens: <code class="text-xs">{{ tokens }}</code>. Other braces are sent as written.
  </p>
  <form method="post" class="rounded-xl border border-base-300/60 bg-base-100 p-5 space-y-5">
    {% csrf_token %}
    {% for field in form %}
    <label class="block space-y-1">
      <span class="text-sm font-medium text-base-content">{{ field.label }}</span>
      {{ field }}
      {% for error in field.errors %}<span class="block text-xs text-error">{{ error }}</span>{% endfor %}
    </label>
    {% endfor %}
    <button class="btn btn-primary">Save message</button>
  </form>
</div>
{% endblock %}
