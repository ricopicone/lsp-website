{% extends "core/base.html" %}
{% block title %}Registration blocked · LSP{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto space-y-6">

  <header class="space-y-2">
    <h1 class="font-serif text-3xl text-base-content">Registration not available</h1>
    <p class="text-sm text-base-content/70">{{ event.title }}</p>
  </header>

  <div class="rounded-lg border border-base-300 bg-base-200/40 p-5 space-y-3">
    <p>{{ reason }}</p>
    <p class="text-sm">
      <a href="{% url 'formation:formation' %}?tab=account" class="link link-primary">Record your tuition decision →</a>
    </p>
  </div>

  <p class="text-sm text-base-content/60">
    Questions? Write to
    <a href="mailto:website@lacanschool.org" class="link">website@lacanschool.org</a>.
  </p>

</div>
{% endblock %}
