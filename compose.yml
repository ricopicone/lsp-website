services:
  web:
    build: .
    image: lsp-website:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    # User uploads go to S3 in production (see config/settings/production.py
    # — AWS_STORAGE_BUCKET_NAME env var triggers S3Storage). No bind-mount
    # needed since the bucket is the source of truth. Local dev without
    # AWS_STORAGE_BUCKET_NAME falls back to FileSystemStorage at
    # BASE_DIR/media inside the dev tree.
