{% extends "availability/base.html" %}
{% block tab_content %}
<div class="max-w-2xl space-y-6">
  <p class="text-base-content/70 text-sm">
    You can always send the review reminder by hand from the Availability tab.
    This setting governs whether a periodic reminder also goes out on its own.
  </p>

  <form method="post" class="rounded-xl border border-base-300/60 bg-base-100 p-5 space-y-5">
    {% csrf_token %}
    {% for field in form %}
    <label class="block space-y-1">
      <span class="text-sm font-medium text-base-content">{{ field.label }}</span>
      {% if field.help_text %}<span class="block text-xs text-base-content/60">{{ field.help_text }}</span>{% endif %}
      {{ field }}
      {% for error in field.errors %}<span class="block text-xs text-error">{{ error }}</span>{% endfor %}
    </label>
    {% endfor %}
    <button class="btn btn-primary">Save settings</button>
  </form>
</div>
{% endblock %}
