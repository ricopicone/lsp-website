{# Works tab — the works the member authored or submitted (see works.queries). #}
<div class="space-y-6">
  <div class="flex items-center justify-end">
    <a href="{% url 'works:add' %}" class="btn btn-primary btn-sm shrink-0">Add a work</a>
  </div>

  {% if works %}
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-x-5 gap-y-8">
    {% for work in works %}
      {% include "works/_card.html" %}
    {% endfor %}
  </div>
  {% else %}
  <div class="rounded-lg border border-dashed border-base-300 p-10 text-center space-y-3">
    <p class="text-base-content/70">No works yet.</p>
    <a href="{% url 'works:add' %}" class="btn btn-primary btn-sm">Add your first work</a>
  </div>
  {% endif %}
</div>
